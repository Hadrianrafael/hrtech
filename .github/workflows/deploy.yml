name: Deploy to Azure Container Apps

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build and push API image (ACR remote build)
        run: |
          az acr build \
            --registry ${{ secrets.AZURE_ACR_NAME }} \
            --image hrtech-api:${{ github.sha }} \
            --image hrtech-api:latest \
            --file apps/api/Dockerfile \
            .

      - name: Build and push web image (ACR remote build)
        run: |
          az acr build \
            --registry ${{ secrets.AZURE_ACR_NAME }} \
            --image hrtech-web:${{ github.sha }} \
            --image hrtech-web:latest \
            --file apps/web/Dockerfile \
            .

      - name: Deploy API revision
        run: |
          az containerapp update \
            --name ${{ secrets.AZURE_API_APP_NAME }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --image ${{ secrets.AZURE_ACR_NAME }}.azurecr.io/hrtech-api:${{ github.sha }}

      - name: Deploy web revision
        run: |
          az containerapp update \
            --name ${{ secrets.AZURE_WEB_APP_NAME }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --image ${{ secrets.AZURE_ACR_NAME }}.azurecr.io/hrtech-web:${{ github.sha }}

      - name: Logout
        if: always()
        run: az logout
